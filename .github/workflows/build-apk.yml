name: Build ReelCounter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi
          if [ -f "./android-project/gradlew" ]; then
            chmod +x ./android-project/gradlew
          fi

      - name: Build Debug APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f "./android-project/gradlew" ]; then
            cd android-project && ./gradlew assembleDebug --stacktrace
          fi

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          find . -name "*.apk" -type f -exec cp {} build-output/ReelCounter-debug.apk \;
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReelCounter-APK
          path: build-output/ReelCounter-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          files: build-output/ReelCounter-debug.apk
          name: "ReelCounter Native Android App v1.0.0"
          tag_name: "v1.0.0-${{ github.run_number }}"
          body: |
            ## 📱 ReelCounter APK Download
            
            This release contains the compiled native Android APK for **ReelCounter**.
            
            ### ✨ Included Features:
            - **Floating VR Goggles Overlay:** Persistent draggable HUD with live video count badge.
            - **Short-Video Detectors:** TikTok, Instagram Reels, YouTube Shorts, Facebook Reels, Snapchat Spotlight.
            - **100% On-Device Privacy:** Local Room Database storage with zero telemetry or cloud servers.
            - **Automated Step-by-Step Permission Wizard:** Guided auto-advancing setup for Usage Stats, Accessibility, Overlay, and Notifications.
            - **Bilingual:** Full English and Arabic (RTL) support with instantaneous layout mirroring.
            
            ### 📥 Installation:
            1. Download `ReelCounter-debug.apk`.
            2. Open the APK on your Android device (Android 10+ / API 29+).
            3. Follow the automated step-by-step permission wizard.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
