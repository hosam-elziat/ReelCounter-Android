name: Build ReelCounter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Prepare Gradle Wrapper and Build APK
        run: |
          # 1. Determine whether the Android project is at root or in android-project/
          if [ -f "android-project/settings.gradle.kts" ]; then
            echo "==> Building inside android-project/ subdirectory"
            cd android-project
          elif [ -f "settings.gradle.kts" ]; then
            echo "==> Building in root directory"
          else
            echo "Error: No settings.gradle.kts found in repository!"
            exit 1
          fi

          # 2. Ensure gradlew is executable
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

          # 3. Ensure gradle-wrapper.jar is present and non-empty (regenerate with installed Gradle if missing)
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Wrapper JAR missing; generating via gradle wrapper..."
            gradle wrapper --gradle-version 8.7
            chmod +x ./gradlew
          fi

          # 4. Compile the debug APK
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect Output APK
        run: |
          mkdir -p build-output
          # Find generated APK anywhere in the tree and copy it to build-output/
          FOUND_APK=$(find . -name "*debug.apk" -o -name "*.apk" | grep -v "build-output" | head -n 1)
          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            echo "Error: No APK file generated during build!"
            exit 1
          fi
          echo "Found compiled APK: $FOUND_APK"
          cp "$FOUND_APK" build-output/ReelCounter-debug.apk
          ls -lh build-output/ReelCounter-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReelCounter-debug-apk
          path: build-output/ReelCounter-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: build-output/ReelCounter-debug.apk
          name: "ReelCounter Native Android App v1.0.0"
          tag_name: "v1.0.0-build-${{ github.run_number }}"
          body: |
            ## 📱 ReelCounter APK Download
            
            This release contains the compiled native Android APK for **ReelCounter**.
            
            ### ✨ Included Features:
            - **Floating VR Goggles Overlay:** Persistent draggable HUD with live video count badge.
            - **Short-Video Detectors:** TikTok, Instagram Reels, YouTube Shorts, Facebook Reels, Snapchat Spotlight.
            - **100% On-Device Privacy:** Local Room Database storage with zero telemetry or cloud servers.
            - **Automated Step-by-Step Permission Wizard:** Guided auto-advancing setup for Usage Stats, Accessibility, Overlay, and Notifications.
            - **Bilingual:** Full English and Arabic (RTL) support with instantaneous layout mirroring.
            
            ### 📥 Installation:
            1. Download `ReelCounter-debug.apk`.
            2. Open the APK on your Android device (Android 10+ / API 29+).
            3. Follow the automated step-by-step permission wizard.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
